<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B337E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chogan кодове">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Кодове на парфюми</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Идея: палитрата и шрифтът на chogangroupspa.com (бяло, почти черно, лилав акцент от логото), код на първо място */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --panel:#F3F3F3; --ink:#1D1D1D; --muted:#525252; --line:#DDDDDD;
  --accent:#6A61A7; --accent-deep:#3B337E; --lilac:#E4E0FD; --btn:#111111; --btn-ink:#FFFFFF;
  --warn:#8A5A00; --warn-bg:#FFF3D6; --danger:#B3261E;
  --display:"Instrument Sans",system-ui,sans-serif; --body:"Instrument Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16112B; --surface:#1F1A3A; --panel:#2A2450; --ink:#F3F3F3; --muted:#B9B5D6; --line:#3A3466;
  --accent:#A89FE6; --accent-deep:#E4E0FD; --lilac:#2A2450; --btn:#E4E0FD; --btn-ink:#16112B;
  --warn:#F0C26B; --warn-bg:#2B2210; --danger:#FF8A80; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#16112B; --surface:#1F1A3A; --panel:#2A2450; --ink:#F3F3F3; --muted:#B9B5D6; --line:#3A3466;
  --accent:#A89FE6; --accent-deep:#E4E0FD; --lilac:#2A2450; --btn:#E4E0FD; --btn-ink:#16112B;
  --warn:#F0C26B; --warn-bg:#2B2210; --danger:#FF8A80; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:16px}
h1{font:600 34px/1.1 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--line)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.danger{color:var(--danger)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{background:var(--lilac);color:var(--accent-deep);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.tools{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}
@media(min-width:760px){.tools{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.tools input{grid-column:span 2}}
.tools input,.tools select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.count{color:var(--muted);font-size:13px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:var(--lilac);display:flex;align-items:center;justify-content:center;color:var(--accent);font:600 40px var(--display)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.code{font:700 24px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.codeRow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{font-size:12px;color:var(--muted)}
.orig{font-weight:600}
.brand{color:var(--muted);font-size:14px}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
.flag{font-size:12px;color:var(--warn)}
.actions{display:flex;gap:8px;padding:0 14px 14px}
.actions .btn{flex:1;padding:7px 10px;font-size:14px}
.brandHead{display:flex;gap:10px;align-items:baseline;margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);font:600 22px var(--display)}
.brandHead span{font:400 13px var(--body);color:var(--muted)}
.rows{display:grid;gap:8px}
:root{--rowbg:#F6F4FF;--rowline:#C9C2F0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rowbg:#241F42;--rowline:#4A4280}}
.row{display:grid;grid-template-columns:auto 92px minmax(110px,1.1fr) minmax(150px,1.6fr) auto;align-items:center;gap:12px;padding:6px 12px;background:var(--rowbg);border:1px solid var(--rowline);border-radius:8px;border-left:4px solid var(--accent);box-shadow:0 2px 6px rgba(59,51,126,.18);line-height:1.25}
.row:not(:has(.th)){grid-template-columns:92px minmax(110px,1.1fr) minmax(150px,1.6fr) auto}
.row .th{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:4px}
.rcode{font:700 17px var(--display);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.rname,.rorig{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname{font-weight:600}
.rname small,.rorig{color:var(--muted)}
.rname small{font-weight:400;font-size:12px}
.rname .flag{color:var(--warn)}
.rsz{display:flex;gap:6px;white-space:nowrap}
.rsz .chip{padding:2px 9px;font-size:13px;border-color:#7F76B8}
@media(max-width:820px){
  .row,.row:not(:has(.th)){grid-template-columns:auto 1fr;grid-template-areas:"c n" "c o" "s s";row-gap:2px}
  .rcode{grid-area:c}.rname{grid-area:n}.rorig{grid-area:o}.rsz{grid-area:s;flex-wrap:wrap}.row .th{display:none}
  .row{padding:9px 12px}.rorig{white-space:normal}
}
}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100% - 24px));max-height:92%}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{padding:18px;display:grid;gap:12px}
form h2{font:600 26px var(--display);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label input,label select,label textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
.sizeRow{display:grid;grid-template-columns:1fr 1.3fr 1.3fr auto;gap:8px;align-items:end}
.photoBox{display:flex;gap:12px;align-items:center}
.photoBox .ph{width:96px;aspect-ratio:1;border-radius:8px;overflow:hidden;font-size:22px}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.err{color:var(--danger);font-size:14px;min-height:18px}
@media(max-width:560px){
  body{font-size:15px}
  h1{font-size:26px}
  .tools input,.tools select,label input,label select,label textarea{font-size:16px;min-height:44px}
  .btn{min-height:44px}
  dialog{width:calc(100% - 16px);max-height:96%}
  form{padding:14px}
  .row2{grid-template-columns:1fr}
  .sizeRow{grid-template-columns:1fr 1fr;}
  .sizeRow>:last-child{grid-column:1/-1}
  .foot .btn{flex:1}
  .brandHead{font-size:19px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Кодове на парфюми</h1>
      <p class="sub">Код на Chogan → оригинална марка и модел, разфасовка и цена</p>
    </div>
  </header>
  <div class="tools">
    <input id="q" type="search" placeholder="Търси по код, име, марка или модел (напр. 094M, Aventus, Dior)" aria-label="Търсене">
    <select id="fBrandFilter" aria-label="Марка"><option value="">Всички марки</option></select>
    <select id="fGroup" aria-label="Категория"><option value="">Всички категории</option></select>
    <select id="fGender" aria-label="Пол"><option value="">Всички</option><option value="W">Дамски</option><option value="M">Мъжки</option><option value="U">Унисекс</option><option value="K">Детски</option></select>
    <select id="fView" aria-label="Групиране"><option value="brand">Групирай по марка</option><option value="flat">Без групиране</option></select>
    <button class="btn" id="clearBtn" type="button">Изчисти филтрите</button>
  </div>
  <p class="count" id="count"></p>
  <div id="grid"></div>
</div>

<dialog id="dlg">
  <form id="f" method="dialog">
    <h2 id="dTitle">Парфюм</h2>
    <div class="row2">
      <label>Код<input id="fCode" required maxlength="20" placeholder="напр. 094"></label>
      <label>Пол<select id="fG"><option value="W">Дамски</option><option value="M">Мъжки</option><option value="U">Унисекс</option><option value="K">Детски</option></select></label>
    </div>
    <div class="row2">
      <label>Име в Chogan<input id="fName" placeholder="напр. Glory for Him"></label>
      <label>Стар код<input id="fOld" maxlength="20" placeholder="напр. 068M"></label>
    </div>
    <div class="row2">
      <label>Оригинална марка<input id="fBrand" placeholder="напр. Creed"></label>
      <label>Оригинален модел<input id="fModel" placeholder="напр. Aventus"></label>
    </div>
    <label>Категория<input id="fGroupIn" list="groups" placeholder="напр. Мъжки"><datalist id="groups"></datalist></label>
    <div>
      <div class="tag" style="margin-bottom:6px">Разфасовки, цена за краен клиент и цена в портала (€)</div>
      <div id="sizes" style="display:grid;gap:8px"></div>
      <button class="btn" type="button" id="addSize" style="margin-top:8px">+ Добави разфасовка</button>
    </div>
    <label>Снимка
      <div class="photoBox"><div class="ph" id="prev">Снимка</div>
        <div style="display:grid;gap:6px"><input id="fPhoto" type="file" accept="image/*"><button class="btn" type="button" id="rmPhoto">Премахни снимката</button></div></div>
    </label>
    <label>Бележка<textarea id="fNote" rows="2"></textarea></label>
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="fConf"> Потвърдено от Chogan (код, цена, разфасовка)</label>
    <div class="err" id="err" role="alert"></div>
    <div class="foot">
      <button class="btn danger" type="button" id="delBtn">Изтрий</button>
      <span style="display:flex;gap:8px"><button class="btn" type="button" id="cancel">Отказ</button><button class="btn primary" type="submit" id="save">Запази</button></span>
    </div>
  </form>
</dialog>

<dialog id="confirmDlg">
  <form method="dialog" style="gap:14px">
    <h2>Да изтрия ли парфюма?</h2>
    <p id="confirmText" style="margin:0"></p>
    <div class="foot" style="justify-content:flex-end"><button class="btn" type="button" id="noDel">Отказ</button><button class="btn danger" type="button" id="yesDel">Изтрий</button></div>
  </form>
</dialog>

const GENDER = {W:"Дамски",M:"Мъжки",U:"Унисекс",K:"Детски"};
let items = [], col = null, editing = null, photoData = "", seeded = false;
const $ = id => document.getElementById(id);

const eur = n => new Intl.NumberFormat("bg-BG",{style:"currency",currency:"EUR"}).format(n);
const sortKey = c => /^\d+$/.test(c) ? [0,+c,""] : [1,0,c];
const cmp = (a,b)=>{const x=sortKey(a.code),y=sortKey(b.code);return x[0]-y[0]||x[1]-y[1]||x[2].localeCompare(y[2]);};
const docId = c => c.trim().replace(/[^A-Za-z0-9_-]/g,"_");
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

const NONE = "Без оригинална марка (собствени линии)";
const ALIAS = {"Giorgio Armani":"Armani"};
const brandOf = d => ALIAS[d.brand] || (d.brand||"").trim() || NONE;
function brandList(){ return [...new Set(items.map(brandOf))].sort((x,y)=> x===NONE?1 : y===NONE?-1 : x.localeCompare(y,"en",{sensitivity:"base"})); }

function render(){
  // списък с марки: пази избраната, ако още съществува
  const bl = brandList(); let bsel = $("fBrandFilter").value; if (bsel && !bl.includes(bsel)) bsel = "";
  $("fBrandFilter").innerHTML = '<option value="">Всички марки ('+bl.length+')</option>' + bl.map(x=>`<option value="${esc(x)}"${x===bsel?" selected":""}>${esc(x)}</option>`).join("");
  const q = $("q").value.trim().toLowerCase(), g = $("fGroup").value, s = $("fGender").value;
  const list = items.filter(d =>
    (!g || d.group===g) && (!s || d.gender===s) && (!bsel || brandOf(d)===bsel) &&
    (!q || [d.code,d.oldCode,d.name,d.brand,d.model,d.note].join(" ").toLowerCase().includes(q))
  ).sort(cmp);
  $("clearBtn").disabled = !(q || bsel || g || s);
  $("count").textContent = list.length + " от " + items.length + " парфюма";
  const card = d => `
    <div class="row" title="${esc([d.note, d.confirmed ? "" : "Не е намерен в портала на Chogan"].filter(Boolean).join(" · "))}">
      ${d.photo ? `<img class="th" src="${d.photo}" alt="">` : ""}
      <span class="rcode">${esc(d.code)}</span>
      <span class="rname">${esc(d.name || "без име")}${d.oldCode ? ` <small>ex ${esc(d.oldCode)}</small>` : ""}${d.confirmed ? "" : ' <small class="flag">не е в портала</small>'}</span>
      <span class="rorig">${esc([d.brand,d.model].filter(Boolean).join(" · ") || "няма оригинал")}</span>
      <span class="rsz">${(d.sizes||[]).map(z=>`<span class="chip">${z.ml} мл <b>${eur(z.price)}</b></span>`).join("") || '<span class="tag">няма цена</span>'}</span>
    </div>`;
  if (!list.length) $("grid").innerHTML = '<div class="empty">Няма резултати. Опитай с друг код или марка.</div>';
  else if ($("fView").value === "flat") $("grid").innerHTML = '<div class="rows">' + list.map(card).join("") + '</div>';
  else {
    const by = {}; list.forEach(d => (by[brandOf(d)] ||= []).push(d));
    const names = Object.keys(by).sort((x,y) => x===NONE ? 1 : y===NONE ? -1 : x.localeCompare(y,"en",{sensitivity:"base"}));
    $("grid").innerHTML = names.map(n => `<section><h2 class="brandHead">${esc(n)} <span>${by[n].length} ${by[n].length===1?"парфюм":"парфюма"}</span></h2><div class="rows">${by[n].map(card).join("")}</div></section>`).join("");
  }
  const groups = [...new Set(items.map(d=>d.group).filter(Boolean))];
  const cur = $("fGroup").value;
  $("fGroup").innerHTML = '<option value="">Всички категории</option>' + groups.map(x=>`<option${x===cur?" selected":""}>${esc(x)}</option>`).join("");
  $("groups").innerHTML = groups.map(x=>`<option value="${esc(x)}">`).join("");
}

function sizeRow(z={ml:"",price:""}){
  const r = document.createElement("div"); r.className="sizeRow";
  r.innerHTML = `<label>Мл<input type="number" min="1" step="1" value="${z.ml}" class="zMl"></label>
    <label>Краен клиент €<input type="number" min="0" step="0.01" value="${z.price}" class="zPr"></label>
    <label>Портал €<input type="number" min="0" step="0.01" value="${z.member??""}" class="zMem"></label>
    <button class="btn" type="button" aria-label="Премахни разфасовката">✕</button>`;
  r.querySelector("button").onclick = () => r.remove();
  $("sizes").appendChild(r);
}
function setPrev(){ $("prev").innerHTML = photoData ? `<img src="${photoData}" alt="">` : "Снимка"; }

function openForm(d){
  editing = d ? d.code : null;
  $("dTitle").textContent = d ? "Редактиране на № "+d.code : "Нов парфюм";
  $("fCode").value = d?.code||""; $("fCode").readOnly = !!d;
  $("fG").value = d?.gender||"W"; $("fName").value = d?.name||""; $("fOld").value = d?.oldCode||""; $("fBrand").value = d?.brand||""; $("fModel").value = d?.model||"";
  $("fGroupIn").value = d?.group||""; $("fNote").value = d?.note||""; $("fConf").checked = !!d?.confirmed;
  $("sizes").innerHTML = ""; (d?.sizes?.length ? d.sizes : [{ml:"",price:""}]).forEach(sizeRow);
  photoData = d?.photo||""; setPrev(); $("fPhoto").value = ""; $("err").textContent = "";
  $("delBtn").style.display = d ? "" : "none";
  $("dlg").showModal();
}

function resize(file){
  return new Promise((ok,fail)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 520/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg",.78)); };
    img.onerror = () => fail(new Error("Файлът не е снимка."));
    img.src = url;
  });
}

const LS_KEY = "chogan-perfumes-v2";
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(items)); return true; }
  catch(e){ alert("Паметта на браузъра е пълна. Махни или намали някои снимки."); return false; }
}
async function persist(d){
  const i = items.findIndex(x=>x.code===d.code);
  if (i>=0) items[i]=d; else items.push(d);
  render(); save();
}
async function remove(code){
  items = items.filter(x=>x.code!==code); render(); save();
}

$("clearBtn").onclick = () => { $("q").value=""; $("fBrandFilter").value=""; $("fGroup").value=""; $("fGender").value=""; render(); $("q").focus(); };

$("addSize").onclick = () => sizeRow();
$("cancel").onclick = () => $("dlg").close();
$("rmPhoto").onclick = () => { photoData=""; $("fPhoto").value=""; setPrev(); };
$("fPhoto").onchange = async e => { const f = e.target.files[0]; if(!f) return;
  try { photoData = await resize(f); setPrev(); $("err").textContent=""; } catch(x){ $("err").textContent = x.message; } };
["q","fBrandFilter","fGroup","fGender","fView"].forEach(id => $(id).addEventListener("input", render));

$("f").onsubmit = async e => {
  e.preventDefault();
  const code = $("fCode").value.trim().toUpperCase();
  if (!code) { $("err").textContent="Попълни код."; return; }
  if (!editing && items.some(x=>x.code===code)) { $("err").textContent="Код "+code+" вече съществува. Отвори го и го редактирай."; return; }
  const sizes = [...$("sizes").querySelectorAll(".sizeRow")].map(r=>{const z={ml:+r.querySelector(".zMl").value, price:+r.querySelector(".zPr").value}; const m=r.querySelector(".zMem").value; if(m!=="") z.member=+m; return z;})
    .filter(z=>z.ml>0 && z.price>=0 && r_ok(z));
  const d = {code, schema:2, edited:true, name:$("fName").value.trim(), oldCode:$("fOld").value.trim().toUpperCase(), gender:$("fG").value, brand:$("fBrand").value.trim(), model:$("fModel").value.trim(),
    group:$("fGroupIn").value.trim(), sizes, photo:photoData, note:$("fNote").value.trim(), confirmed:$("fConf").checked};
  try { await persist(d); $("dlg").close(); } catch(x){ $("err").textContent = "Не успях да запазя: "+(x.message||x); }
};
function r_ok(z){ return Number.isFinite(z.ml) && Number.isFinite(z.price); }

$("delBtn").onclick = () => {
  const d = items.find(x=>x.code===editing);
  $("confirmText").textContent = "№ "+d.code+" · "+d.model+(d.brand?" ("+d.brand+")":"")+". Действието не може да се върне.";
  $("confirmDlg").showModal();
};
$("noDel").onclick = () => $("confirmDlg").close();
$("yesDel").onclick = async () => { const c = editing; $("confirmDlg").close(); $("dlg").close(); await remove(c); };

async function init(){
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch(e){}
  items = Array.isArray(stored) && stored.length ? stored : SEED.map(x=>({...x}));
  if (!stored) save();
  render();
}
init();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
